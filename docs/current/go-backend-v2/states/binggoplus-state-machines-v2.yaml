schema_version: v2-state-1-candidate
status: FREEZE_CANDIDATE
product: binggoplus
machines:
  deployment_set:
    initial: DISCOVERED
    terminal: [SUPERSEDED, DEACTIVATED, REJECTED]
    transitions:
      DISCOVERED: [STATIC_VERIFIED, REJECTED]
      STATIC_VERIFIED: [LIVE_VERIFIED, REJECTED]
      LIVE_VERIFIED: [ACTIVE, REJECTED]
      ACTIVE: [SUPERSEDED, DEACTIVATED]
      SUPERSEDED: []
      DEACTIVATED: []
      REJECTED: []
    invariants:
      - ONLY_ONE_ACTIVE_PER_ENVIRONMENT
      - ACTIVE_REQUIRES_RUNTIME_CODE_AND_GETTER_READBACK
  chain_cursor:
    initial: BOOTSTRAP
    transitions:
      BOOTSTRAP: [SCANNING, HALTED]
      SCANNING: [HEALTHY, DEGRADED, REORG_RECOVERY, HALTED]
      HEALTHY: [SCANNING, DEGRADED, REORG_RECOVERY, HALTED]
      DEGRADED: [SCANNING, HEALTHY, REORG_RECOVERY, HALTED]
      REORG_RECOVERY: [SCANNING, HEALTHY, HALTED]
      HALTED: [BOOTSTRAP, SCANNING]
    invariants:
      - NEXT_BLOCK_IS_FIRST_UNSCANNED_BLOCK
      - FENCING_TOKEN_MUST_MATCH_ACTIVE_LEASE
      - HALTED_EXIT_REQUIRES_APPROVED_RECOVERY
  raw_event:
    initial: OBSERVED
    terminal: [ORPHANED]
    transitions:
      OBSERVED: [CONFIRMED, ORPHANED, DECODE_FAILED]
      CONFIRMED: [ORPHANED, DECODE_FAILED]
      DECODE_FAILED: [OBSERVED, CONFIRMED, ORPHANED]
      ORPHANED: []
    invariants:
      - PROJECTION_COMPLETION_IS_DERIVED_FROM_REQUIRED_APPLIED_RECEIPTS
      - RAW_TOPIC_AND_DATA_ARE_IMMUTABLE
  projection_receipt:
    # First processing may INSERT APPLIED or FAILED directly.
    initial: [APPLIED, FAILED]
    terminal: [REVERTED]
    transitions:
      APPLIED: [REVERTED, FAILED]
      REVERTED: []
      FAILED: [APPLIED]
    invariants:
      - IDEMPOTENT_BY_EVENT_PROJECTOR_VERSION
      - FIRST_FAILURE_MAY_INSERT_FAILED_WITHOUT_PRIOR_APPLIED
  governance_command:
    initial: CREATED
    terminal: [FINALIZED, REJECTED, CANCELLED, FAILED, EXPIRED]
    transitions:
      CREATED: [VALIDATED, REJECTED, CANCELLED, EXPIRED]
      VALIDATED: [PENDING_APPROVAL, APPROVED, REJECTED, CANCELLED, EXPIRED]
      PENDING_APPROVAL: [APPROVED, REJECTED, CANCELLED, EXPIRED]
      APPROVED: [QUEUED, CANCELLED, EXPIRED]
      QUEUED: [SIGNING, CANCELLED, FAILED, EXPIRED]
      SIGNING: [SUBMITTED, FAILED]
      SUBMITTED: [CONFIRMED, FAILED]
      CONFIRMED: [FINALIZED, FAILED]
      FINALIZED: []
      REJECTED: []
      CANCELLED: []
      FAILED: []
      EXPIRED: []
    invariants:
      - FIXED_TARGET_AND_SELECTOR_FOR_ACTION
      - REQUESTER_CANNOT_APPROVE_OWN_HIGH_RISK_COMMAND
      - SUBMITTED_COMMAND_IS_ALWAYS_RECONCILED
      - HTTP_RETRY_NEVER_CREATES_DUPLICATE_ACTION
      - ONE_DIVIDEND_PUBLISH_COMMAND_PER_PREFLIGHT
      - COMMAND_CONTEXT_AND_EXPIRY_ARE_IMMUTABLE
      - RECONCILER_CANNOT_INSERT_COMMANDS
      - SQL_TRANSITION_GUARD_MATCHES_EXACT_GRAPH
      - TERMINAL_COMMAND_STATE_CANNOT_REENTER_QUEUE
  governance_tx_attempt:
    initial: SIGNED
    terminal: [MINED_SUCCESS, MINED_REVERT, REPLACED, DROPPED, FAILED]
    transitions:
      SIGNED: [BROADCAST, FAILED]
      BROADCAST: [MINED_SUCCESS, MINED_REVERT, REPLACED, DROPPED, FAILED]
      MINED_SUCCESS: []
      MINED_REVERT: []
      REPLACED: []
      DROPPED: []
      FAILED: []
    invariants:
      - ONE_LIVE_ATTEMPT_PER_SIGNER_NONCE
      - REPLACEMENT_PRESERVES_COMMAND_ID
  dividend_epoch:
    initial: DRAFT
    terminal: [CLOSED, CANCELLED]
    transitions:
      DRAFT: [SNAPSHOT_BUILDING, CANCELLED]
      SNAPSHOT_BUILDING: [SNAPSHOT_READY, FAILED, CANCELLED]
      SNAPSHOT_READY: [APPROVAL_PENDING, SNAPSHOT_BUILDING, CANCELLED]
      APPROVAL_PENDING: [APPROVED, SNAPSHOT_BUILDING, CANCELLED]
      APPROVED: [PUBLISH_QUEUED, SNAPSHOT_BUILDING, CANCELLED]
      PUBLISH_QUEUED: [CLAIM_OPEN, FAILED]
      CLAIM_OPEN: [CLOSE_QUEUED]
      CLOSE_QUEUED: [CLOSED, FAILED]
      FAILED: [SNAPSHOT_BUILDING, PUBLISH_QUEUED, CLOSE_QUEUED, CANCELLED]
      CLOSED: []
      CANCELLED: []
    invariants:
      - SNAPSHOT_BINDS_BLOCK_NUMBER_AND_HASH
      - SNAPSHOT_BLOCK_IS_CANONICAL_AND_FINALIZED
      - SNAPSHOT_LOCKS_REQUIRED_PROJECTOR_VERSIONS
      - SNAPSHOT_REQUIRES_COMPLETE_APPLIED_RECEIPTS
      - SNAPSHOT_REPLAYS_HISTORICAL_VIEWS_NOT_CURRENT_TABLES
      - ARTIFACT_BINDS_NORMALIZED_INPUT_CHECKSUM
      - BUILDER_OWNS_PRE_PUBLISH_EPOCH_STATE
      - PROJECTOR_OWNS_EVENT_DERIVED_EPOCH_STATE_AND_ROOT
      - BUILDER_CANNOT_WRITE_EPOCH_MERKLE_ROOT
      - ARTIFACT_CHANGE_INVALIDATES_APPROVAL
      - PUBLISHED_ROOT_EQUALS_APPROVED_ARTIFACT
      - CLAIM_WINDOW_IS_DEPLOYED_CONTRACT_RULE
      - SQL_TRANSITION_GUARD_MATCHES_EXACT_GRAPH
      - CLOSED_AND_CANCELLED_ARE_IRREVERSIBLE
      - CLAIM_OPEN_ROOT_AND_WINDOW_ARE_IMMUTABLE
  job:
    initial: QUEUED
    terminal: [SUCCEEDED, CANCELLED, DEAD_LETTER]
    transitions:
      QUEUED: [RUNNING, CANCELLED]
      RUNNING: [SUCCEEDED, FAILED, CANCELLED]
      FAILED: [QUEUED, DEAD_LETTER]
      SUCCEEDED: []
      CANCELLED: []
      DEAD_LETTER: []
    invariants:
      - RETRY_PRESERVES_DEDUPE_KEY
      - RETRY_LIMIT_IS_BOUNDED
