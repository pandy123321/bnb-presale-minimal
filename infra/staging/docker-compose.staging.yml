# PANGU2 — Staging Docker Compose (BSC Testnet)
# 
# Uses I04 testnet contract addresses (TBD → replace after deployment).
# Does NOT include Anvil — connects to external BSC Testnet RPC.
# Chain Worker connects to testnet RPC directly.
#
# Run: docker compose -f docker-compose.yml -f infra/staging/docker-compose.staging.yml up -d

services:
  # ── PostgreSQL (staging) ─────────────────
  postgres:
    extends:
      file: ../../docker-compose.yml
      service: postgres
    environment:
      POSTGRES_DB: pangu2_staging
      POSTGRES_USER: pangu2
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - staging_pgdata:/var/lib/postgresql/data

  # ── Redis (staging) ──────────────────────
  redis:
    extends:
      file: ../../docker-compose.yml
      service: redis

  # ── PHP-FPM (staging) ────────────────────
  php:
    build:
      context: ../../docker/php
      dockerfile: Dockerfile
    container_name: pangu2-php-staging
    restart: unless-stopped
    working_dir: /var/www
    environment:
      APP_ENV: staging
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: pangu2_staging
      DB_USERNAME: pangu2
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis

      # ── BSC Testnet (from I04 config) ──
      PANGU2_CHAIN_ID: "97"
      PANGU2_CHAIN_NAME: "BSC Testnet"
      PANGU2_RPC_URL: ${PANGU2_RPC_URL}
      PANGU2_BACKUP_RPC_URL: ${PANGU2_BACKUP_RPC_URL}
      PANGU2_SUPPORTED_NETWORKS: "31337,97"
      PANGU2_AUTH_DOMAIN: ${PANGU2_AUTH_DOMAIN}
      ALLOW_MAINNET_WRITES: "false"

      # ── Deployed contracts (TBD → fill from DEPLOYMENT_MANIFEST.md) ──
      PANGU2_TOKEN_ADDRESS: ${PANGU2_TOKEN_ADDRESS:-TBD}
      PANGU2_TRADE_ROUTER_ADDRESS: ${PANGU2_TRADE_ROUTER_ADDRESS:-TBD}
      PANGU2_DIVIDEND_ADDRESS: ${PANGU2_DIVIDEND_ADDRESS:-TBD}
      PANGU2_SUPPORT_POOL_ADDRESS: ${PANGU2_SUPPORT_POOL_ADDRESS:-TBD}
      PANGU2_BUYBACK_LOCKER_ADDRESS: ${PANGU2_BUYBACK_LOCKER_ADDRESS:-TBD}
      PANGU2_FEE_VAULT_ADDRESS: ${PANGU2_FEE_VAULT_ADDRESS:-TBD}
      PANGU2_COST_BASIS_ADDRESS: ${PANGU2_COST_BASIS_ADDRESS:-TBD}
      PANGU2_DEPLOYMENT_BLOCK: ${PANGU2_DEPLOYMENT_BLOCK:-0}

    volumes:
      - ../../backend:/var/www
      - ../../docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Nginx (staging) ──────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: pangu2-nginx-staging
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ../../backend:/var/www
      - ../../docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      # Serve DApp static build alongside backend API
      - ../../apps/dapp/dist:/var/www/dapp
      - ./nginx-dapp.conf:/etc/nginx/conf.d/dapp.conf
    depends_on:
      - php
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/up"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Queue Worker (staging) ───────────────
  queue:
    build:
      context: ../../docker/php
      dockerfile: Dockerfile
    container_name: pangu2-queue-staging
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    environment:
      APP_ENV: staging
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_DATABASE: pangu2_staging
      DB_USERNAME: pangu2
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
    volumes:
      - ../../backend:/var/www
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Scheduler (staging) ───────────────────
  scheduler:
    build:
      context: ../../docker/php
      dockerfile: Dockerfile
    container_name: pangu2-scheduler-staging
    restart: unless-stopped
    working_dir: /var/www
    command: sh -c "while true; do php artisan schedule:run; sleep 60; done"
    environment:
      APP_ENV: staging
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_DATABASE: pangu2_staging
      DB_USERNAME: pangu2
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
    volumes:
      - ../../backend:/var/www
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  staging_pgdata:
