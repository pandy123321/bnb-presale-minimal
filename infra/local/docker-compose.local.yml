# ═══════════════════════════════════════════
# PANGU2 Local Development Environment
# docker compose -f infra/local/docker-compose.local.yml up -d
# ═══════════════════════════════════════════

services:
  # ── Data Layer ────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: bnb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bnb_presale
      POSTGRES_USER: bnb
      POSTGRES_PASSWORD: bnb_dev_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bnb -d bnb_presale"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bnb-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Blockchain Layer ──────────────────────

  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: bnb-anvil
    restart: unless-stopped
    command: >
      anvil
      --host 0.0.0.0
      --port 8545
      --chain-id 31337
      --block-time 2
      --balance 10000
    ports:
      - "8545:8545"
    healthcheck:
      test: ["CMD", "cast", "block-number", "--rpc-url", "http://localhost:8545"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Backend Layer ─────────────────────────

  php:
    build:
      context: ../..
      dockerfile: docker/php/Dockerfile
    container_name: bnb-php
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ../../backend:/var/www
      - ../../docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: bnb-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ../../backend:/var/www
      - ../../docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/up"]
      interval: 15s
      timeout: 5s
      retries: 10

  queue:
    build:
      context: ../..
      dockerfile: docker/php/Dockerfile
    container_name: bnb-queue
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      - ../../backend:/var/www
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    build:
      context: ../..
      dockerfile: docker/php/Dockerfile
    container_name: bnb-scheduler
    restart: unless-stopped
    working_dir: /var/www
    command: |
      sh -c "while true; do php artisan schedule:run; sleep 60; done"
    volumes:
      - ../../backend:/var/www
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Frontend / API Layer ──────────────────

  mock-api:
    build:
      context: ../..
      dockerfile: infra/local/Dockerfile.node
    container_name: bnb-mock-api
    restart: unless-stopped
    working_dir: /workspace/packages/mock-api
    command: sh /entrypoint.sh packages/mock-api pnpm dev
    ports:
      - "4000:4000"
    volumes:
      - ../..:/workspace
      - node_modules_mock:/workspace/packages/mock-api/node_modules
      - node_modules_types:/workspace/packages/api-types/node_modules
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  dapp:
    build:
      context: ../..
      dockerfile: infra/local/Dockerfile.node
    container_name: bnb-dapp
    restart: unless-stopped
    working_dir: /workspace/apps/dapp
    command: sh /entrypoint.sh apps/dapp pnpm dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    volumes:
      - ../..:/workspace
      - node_modules_dapp:/workspace/apps/dapp/node_modules
    depends_on:
      mock-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5173"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  admin:
    build:
      context: ../..
      dockerfile: infra/local/Dockerfile.node
    container_name: bnb-admin
    restart: unless-stopped
    working_dir: /workspace/apps/admin
    command: sh /entrypoint.sh apps/admin pnpm dev -- --host 0.0.0.0
    ports:
      - "5174:5174"
    volumes:
      - ../..:/workspace
      - node_modules_admin:/workspace/apps/admin/node_modules
    depends_on:
      mock-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5174"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  pgdata:
  node_modules_mock:
  node_modules_types:
  node_modules_dapp:
  node_modules_admin:
