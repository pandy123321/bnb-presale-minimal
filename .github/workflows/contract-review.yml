name: Contract Review

on:
  pull_request:
    branches: [main]
    paths:
      - "contracts/**"
  push:
    branches: [main]
    paths:
      - "contracts/**"
  workflow_dispatch:

concurrency:
  group: contract-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Contract Review (Build + Test + Lint + Gas)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Show versions
        run: |
          forge --version
          forge config

      - name: Install dependencies
        run: |
          forge install OpenZeppelin/openzeppelin-contracts@v5.0.2 --no-git
          forge install foundry-rs/forge-std@v1.16.2 --no-git

      - name: Build
        run: forge build

      - name: Check contract sizes
        run: forge build --sizes

      - name: Format check
        run: forge fmt --check

      - name: Run tests (verbose + fuzz)
        run: forge test -vvv --fuzz-runs 10000
        env:
          FOUNDRY_FUZZ_RUNS: 10000

      - name: Run invariant tests
        run: forge test --match-path "test/invariant/**" -vvv

      - name: Coverage
        run: forge coverage --report lcov

      - name: Gas snapshot diff
        run: |
          forge snapshot --check .gas-snapshot || echo "Gas snapshot diff found (review required)"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: contracts/lcov.info
          retention-days: 90

      - name: Upload gas snapshot
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gas-snapshot
          path: contracts/.gas-snapshot
          retention-days: 90

  lint-warnings:
    name: Lint Warnings Summary
    runs-on: ubuntu-latest
    needs: review
    if: always()
    defaults:
      run:
        working-directory: contracts

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Install dependencies
        run: |
          forge install OpenZeppelin/openzeppelin-contracts@v5.0.2 --no-git
          forge install foundry-rs/forge-std@v1.16.2 --no-git

      - name: Build with warnings
        run: forge build --sizes 2>&1 | grep -E "warning|Error" || echo "No warnings found"
