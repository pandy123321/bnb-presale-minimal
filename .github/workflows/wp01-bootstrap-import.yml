name: WP-01 Bootstrap Import

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wp01-bootstrap-import.yml'
      - 'bnb-presale-minimal-wp01.bundle'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout upload branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and import frozen bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f bnb-presale-minimal-wp01.bundle
          echo '85a71018a3857f7fa708e130641824cf9039da3460e306b87a5a953314d26af3  bnb-presale-minimal-wp01.bundle' | sha256sum -c -
          git bundle verify bnb-presale-minimal-wp01.bundle
          git bundle list-heads bnb-presale-minimal-wp01.bundle | tee /tmp/wp01-bundle-heads.txt
          grep -q '^9e36ba27da07fee49da244551804dc9603aa71fa refs/heads/main$' /tmp/wp01-bundle-heads.txt
          git fetch bnb-presale-minimal-wp01.bundle refs/heads/main:refs/remotes/wp01/main
          test "$(git rev-parse refs/remotes/wp01/main)" = '9e36ba27da07fee49da244551804dc9603aa71fa'
          git push origin refs/remotes/wp01/main:refs/heads/main --force
          git reset --hard refs/remotes/wp01/main
          test -d contracts
          test -d docs/current
          test -d docs/baseline
          test ! -d backend

      - name: Record import evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p reports
          cat > reports/WP01_BUNDLE_IMPORT_REPORT.txt <<'EOF'
          WP-01 bundle import: PASS
          Bundle SHA256: 85a71018a3857f7fa708e130641824cf9039da3460e306b87a5a953314d26af3
          Imported baseline commit: 9e36ba27da07fee49da244551804dc9603aa71fa
          Required directories: contracts, docs/current, docs/baseline
          Laravel feature development: NOT_STARTED
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/WP01_BUNDLE_IMPORT_REPORT.txt
          git commit -m 'chore: record frozen WP-01 bundle import'
          git push origin HEAD:main
