name: CI - PR Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # ══�?Solidity Contracts (unit + fuzz, NO fork) ══�?
  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: "v1.7.1"

      - run: forge fmt --check
      - run: forge build
      - run: forge test --no-match-path "*/fork/*"

  contracts-fork:
    name: Contracts (Fork BSC Testnet)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: "v1.7.1"
      - name: Read fork config
        id: fork-config
        run: |
          source ../config/testnet/FORK_CONFIG.txt
          echo "rpc=$FORK_RPC" >> "$GITHUB_OUTPUT"
          echo "block=$FORK_BLOCK" >> "$GITHUB_OUTPUT"
      - name: Forge build
        run: forge build
      - name: Fork test (fixed block)
        env:
          BSC_TESTNET_RPC_URL: ${{ steps.fork-config.outputs.rpc }}
          BSC_TESTNET_FORK_BLOCK: ${{ steps.fork-config.outputs.block }}
        run: forge test --match-path "test/fork/**" -vvv

  # ══�?Laravel Backend ══�?
  backend:
    name: Backend
    runs-on: ubuntu-latest
    env:
      DB_CONNECTION: pgsql
      DB_HOST: localhost
      DB_PORT: 5432
      DB_DATABASE: bnb_presale
      DB_USERNAME: bnb
      DB_PASSWORD: bnb_dev_pass
      REDIS_HOST: localhost
      REDIS_PORT: 6379
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bnb
          POSTGRES_PASSWORD: bnb_dev_pass
          POSTGRES_DB: bnb_presale
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"

      - name: Verify DB connection
        run: |
          pg_ready=false
          for i in $(seq 1 30); do
            if pg_isready -h localhost -U bnb -d bnb_presale 2>/dev/null; then
              pg_ready=true
              break
            fi
            sleep 1
          done
          if [ "$pg_ready" != "true" ]; then
            echo "ERROR: PostgreSQL did not become ready after 30s"
            exit 1
          fi
          echo "PostgreSQL ready."

          redis_ready=false
          for i in $(seq 1 10); do
            if redis-cli -h localhost ping 2>/dev/null; then
              redis_ready=true
              break
            fi
            sleep 1
          done
          if [ "$redis_ready" != "true" ]; then
            echo "ERROR: Redis did not become ready after 10s"
            exit 1
          fi
          echo "Redis ready."
        shell: bash

      - run: cp .env.example .env
      - run: composer install --no-progress --prefer-dist
      - run: php artisan migrate:fresh --env=testing --force
      - run: php artisan test

  # ══�?Frontend (DApp + Admin) ══�?
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "10.34.5"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies (fail-closed)
        run: pnpm install --frozen-lockfile

      - name: DApp Typecheck + Test + Build
        run: |
          cd apps/dapp
          pnpm run typecheck
          pnpm run test
          pnpm run build

      - name: Admin Typecheck + Test + Build
        run: |
          cd apps/admin
          pnpm run typecheck
          pnpm run test
          pnpm run build

  # ══�?Shared Packages Tests ══�?
  packages:
    name: Shared Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "10.34.5"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Mock API Contract Test
        run: |
          cd packages/mock-api
          pnpm run dev &
          SERVER_PID=$!
          cleanup() { kill "$SERVER_PID" 2>/dev/null || true; }
          trap cleanup EXIT

          ready=false
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4000/health 2>/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != "true" ]; then
            echo "ERROR: Mock API did not start after 30s"
            exit 1
          fi
          pnpm run test
        shell: bash

      - name: Schema Validator
        run: |
          cd packages/schema-validator
          pnpm run validate

  # ══�?Chain Worker Tests ══�?
  chain-worker:
    name: Chain Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "10.34.5"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Chain Worker Tests
        run: |
          cd services/chain-worker
          pnpm run typecheck
          pnpm run test
