name: CI — PR Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # ═══ Solidity Contracts (unit + fuzz, NO fork) ═══

  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: "v1.7.1"

      - run: forge fmt --check
      - run: forge build
      - run: forge test --no-match-path "*/fork/*"

  # ═══ Contracts Fork Tests (requires BSC_TESTNET_RPC_URL repo secret) ═══
  # Only runs on push to main, not on PR from forks.
  # Must FAIL if secret is missing — fork tests are a required gate.

  contracts-fork:
    name: Contracts (BSC Testnet Fork)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: bsc-testnet
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: "v1.7.1"

      - name: Validate fork environment variables
        run: |
          if [ -z "${{ secrets.BSC_TESTNET_RPC_URL }}" ]; then
            echo "ERROR: BSC_TESTNET_RPC_URL secret is not configured."
            echo "Fork tests are a required gate and cannot be skipped."
            exit 1
          fi
          if [ -z "${{ secrets.BSC_TESTNET_FORK_BLOCK }}" ]; then
            echo "ERROR: BSC_TESTNET_FORK_BLOCK secret is not configured."
            echo "Fork tests require a fixed, approved block number."
            exit 1
          fi
          echo "Fork URL and block number configured."
        shell: bash

      - run: forge build

      - name: Run fork tests
        env:
          FORK_URL: ${{ secrets.BSC_TESTNET_RPC_URL }}
          FORK_BLOCK: ${{ secrets.BSC_TESTNET_FORK_BLOCK }}
        run: >
          forge test
          --match-path "*/fork/*"
          --fork-url "$FORK_URL"
          --fork-block-number "$FORK_BLOCK"

  # ═══ Laravel Backend ═══

  backend:
    name: Backend
    runs-on: ubuntu-latest
    env:
      DB_CONNECTION: pgsql
      DB_HOST: localhost
      DB_PORT: 5432
      DB_DATABASE: bnb_presale
      DB_USERNAME: bnb
      DB_PASSWORD: bnb_dev_pass
      REDIS_HOST: localhost
      REDIS_PORT: 6379
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bnb
          POSTGRES_PASSWORD: bnb_dev_pass
          POSTGRES_DB: bnb_presale
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"

      - name: Verify DB connection
        run: |
          echo "Waiting for PostgreSQL..."
          for i in $(seq 1 30); do
            pg_isready -h localhost -U bnb -d bnb_presale && break
            sleep 1
          done
          echo "Waiting for Redis..."
          for i in $(seq 1 10); do
            redis-cli -h localhost ping && break
            sleep 1
          done
        shell: bash

      - run: cp .env.example .env
      - run: composer install --no-progress --prefer-dist
      - run: php artisan migrate:fresh --env=testing --force
      - run: php artisan test

  # ═══ Frontend (DApp + Admin) ═══

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "10.9.2"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies (fail-closed)
        run: pnpm install --frozen-lockfile

      - name: DApp Typecheck + Test + Build
        run: |
          cd apps/dapp
          pnpm run typecheck
          pnpm run test
          pnpm run build

      - name: Admin Typecheck + Test + Build
        run: |
          cd apps/admin
          pnpm run typecheck
          pnpm run test
          pnpm run build

  # ═══ Shared Packages Tests ═══

  packages:
    name: Shared Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "10.9.2"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Mock API Contract Test
        run: |
          cd packages/mock-api
          pnpm run dev &
          sleep 3
          pnpm run test
          kill %1 2>/dev/null || true

      - name: Schema Validator
        run: |
          cd packages/schema-validator
          pnpm run validate

  # ═══ Chain Worker Tests ═══

  chain-worker:
    name: Chain Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "10.9.2"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Chain Worker Tests
        run: |
          cd services/chain-worker
          pnpm run typecheck
          pnpm run test
